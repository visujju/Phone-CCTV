name: Build StreamHub TV APK

on:
  push:
    branches:
      - arena/525da6f3-phone-cctv
    paths:
      - 'android/**'
      - 'viewer.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable Android APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Name installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StreamHub-TV.apk

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: streamhub-tv-apk-v1.0.1
          target_commitish: ${{ github.sha }}
          name: StreamHub TV Browser APK 1.0.1
          body: |
            Installable, debug-signed StreamHub TV Browser APK for Android TV and Android.
            This is a sideload/testing build, not a Play Store-signed release.
          files: StreamHub-TV.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
