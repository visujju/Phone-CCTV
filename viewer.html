<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV - Viewer Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .header { max-width: 1200px; margin: 0 auto 20px auto; display: flex; gap: 10px; align-items: center; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #333; font-size: 15px; }
    input { background: #2a2a2a; color: #fff; flex: 1; }
    button { background: #34c759; color: white; border: none; font-weight: bold; cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    .cam-card { background: #1e1e1e; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid transparent; transition: border-color 0.3s; }
    .cam-card.motion { border-color: #ff3b30; animation: pulse 1s infinite alternate; }
    video { width: 100%; aspect-ratio: 16/9; background: #000; object-fit: cover; display: block; }
    .cam-title { padding: 10px; font-weight: 600; font-size: 14px; background: #252525; display: flex; justify-content: space-between; }
    
    @keyframes pulse {
      from { box-shadow: 0 0 5px rgba(255, 59, 48, 0.4); }
      to { box-shadow: 0 0 20px rgba(255, 59, 48, 1); }
    }
  </style>
</head>
<body>

  <div class="header">
    <input type="text" id="serverUrl" placeholder="wss://your-app.onrender.com">
    <button id="connectBtn">Connect Dashboard</button>
  </div>

  <div id="grid" class="grid"></div>

  <script>
    const defaultWsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    document.getElementById('serverUrl').value = `${defaultWsProtocol}//${window.location.host}`;

    const viewerId = 'viewer_' + Math.random().toString(36).substring(2, 9);
    let ws = null;
    let peerConnections = {};
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    const connectBtn = document.getElementById('connectBtn');
    const grid = document.getElementById('grid');

    // Simple Web Audio API alert sound synthesizer
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch(e) {}
    }

    connectBtn.onclick = () => {
      const serverUrl = document.getElementById('serverUrl').value.trim();
      if (!serverUrl) return alert('Enter server URL.');

      connectBtn.disabled = true;
      ws = new WebSocket(serverUrl);

      ws.onopen = () => {
        connectBtn.innerText = 'Connected';
        ws.send(JSON.stringify({ type: 'register-viewer', id: viewerId }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.type) {
          case 'camera-list':
            msg.cameras.forEach(cam => initCameraConnection(cam));
            break;

          case 'answer':
            if (peerConnections[msg.senderId]) {
              await peerConnections[msg.senderId].setRemoteDescription(new RTCSessionDescription(msg.answer));
            }
            break;

          case 'candidate':
            if (peerConnections[msg.senderId]) {
              await peerConnections[msg.senderId].addIceCandidate(new RTCIceCandidate(msg.candidate));
            }
            break;

          case 'motion-alert':
            triggerMotionAlert(msg.cameraId);
            break;

          case 'camera-disconnected':
            removeCameraCard(msg.cameraId);
            break;
        }
      };
    };

    async function initCameraConnection(camera) {
      if (document.getElementById(`card-${camera.id}`)) return; // Already rendered

      createCameraCard(camera.id, camera.name);

      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[camera.id] = pc;

      pc.ontrack = (event) => {
        const video = document.getElementById(`video-${camera.id}`);
        if (video) video.srcObject = event.streams[0];
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          ws.send(JSON.stringify({ type: 'candidate', targetId: camera.id, candidate: e.candidate }));
        }
      };

      // Create & send WebRTC offer to the target camera node
      const offer = await pc.createOffer({ offerToReceiveVideo: true });
      await pc.setLocalDescription(offer);

      ws.send(JSON.stringify({
        type: 'offer',
        targetId: camera.id,
        offer
      }));
    }

    function createCameraCard(id, name) {
      const card = document.createElement('div');
      card.className = 'cam-card';
      card.id = `card-${id}`;
      card.innerHTML = `
        <video id="video-${id}" autoplay playsinline muted></video>
        <div class="cam-title">
          <span>${name}</span>
          <span id="badge-${id}" style="color: #34c759;">LIVE</span>
        </div>
      `;
      grid.appendChild(card);
    }

    function removeCameraCard(id) {
      if (peerConnections[id]) {
        peerConnections[id].close();
        delete peerConnections[id];
      }
      document.getElementById(`card-${id}`)?.remove();
    }

    function triggerMotionAlert(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.classList.add('motion');
        playBeep();
        setTimeout(() => card.classList.remove('motion'), 2000);
      }
    }
  </script>
</body>
</html>
