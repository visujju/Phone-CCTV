name: Build TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Project Dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor & Android
        run: |
          npx cap init "Phone CCTV" "com.sanju.cctv" --web-dir out
          npx cap add android

      - name: Optimize for Android TV Remote
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          xml = xml.replace('<application', '<uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />\n    <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />\n    <application');
          xml = xml.replace('<category android:name=\"android.intent.category.LAUNCHER\" />', '<category android:name=\"android.intent.category.LAUNCHER\" />\n                <category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />');
          fs.writeFileSync(path, xml);
          "

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compile APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v3
        with:
          name: CCTV-TV-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
